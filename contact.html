<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - Abdullah Mohammad Al-Omariyeen</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html">Abdullah<span>.</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a class="active" href="contact.html">Contact Me</a>
      </div>
    </nav>
  </header>

  <main class="contact-page container">
    <div class="contact-intro">
      <p class="eyebrow">GET IN TOUCH</p>
      <h1>Contact Me</h1>
      <p>Have a question, suggestion, or opportunity? Fill out the form below. I would be happy to hear from you.</p>
    </div>

    <form id="contactForm" class="contact-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com">
        </div>
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select your country</option>
          <option value="Jordan">Jordan</option>
          <option value="Saudi Arabia">Saudi Arabia</option>
          <option value="United Arab Emirates">United Arab Emirates</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="6" placeholder="Write your message here"></textarea>
      </div>
      <button class="button submit-button" type="submit">Submit Message</button>
      <p class="form-hint">All fields are required.</p>
    </form>
  </main>

  <footer class="footer"><p>© 2026 Abdullah Mohammad Al-Omariyeen · Personal Portfolio</p></footer>
</body>
</html>
